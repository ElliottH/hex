name: Check macOS

on:
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "build.rs"
      - "src/**"
      - "native/**"
      - "macos/HexMicrophoneDriver/Info.plist"
      - "resources/**"
      - "assets/**"
      - "app/**"
      - "scripts/validate-app.sh"
      - "scripts/test-app-identity.sh"
      - ".github/workflows/check-macos.yml"
  push:
    branches: [main, rune-ui]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "build.rs"
      - "src/**"
      - "native/**"
      - "macos/HexMicrophoneDriver/Info.plist"
      - "resources/**"
      - "assets/**"
      - "app/**"
      - "scripts/validate-app.sh"
      - "scripts/test-app-identity.sh"
      - ".github/workflows/check-macos.yml"

permissions:
  contents: read

concurrency:
  group: macos-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-26
    timeout-minutes: 60
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Install the Metal toolchain
        run: xcrun --sdk macosx metal --version || xcodebuild -downloadComponent MetalToolchain
      - run: cargo fmt --all --check
      - run: scripts/test-app-identity.sh
      - run: cargo clippy --locked --bin voice-control --tests -- -D warnings
      - run: cargo test --locked --bin voice-control
      - name: No compromised eMudhra CA roots
        run: cargo build --locked --bin voice-control && scripts/check-ca-roots.sh target/debug/voice-control
