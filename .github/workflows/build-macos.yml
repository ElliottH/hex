name: Build macOS release

# Builds the release Hex.app from one exact commit, signs it with Anomaly's
# Developer ID (team 5NZ4Q7NXJ4), and notarizes and staples the app and its
# DMG through scripts/release-app.sh prepare. Uploads one artifact,
# hex-macos-arm64, holding the release service targets
# (docs/plans/release-service.md): Hex-<version>-macos-arm64.zip (root
# Hex.app, for the updater) and Hex-<version>-macos-arm64.dmg. Publishes
# nothing. With optional, an environment without the Apple secrets skips
# the build (no artifact) instead of failing, so dev builds go on unsigned
# platforms' targets aside.
on:
  workflow_call:
    inputs:
      sha:
        type: string
        required: true
      version:
        type: string
        required: true
      channel:
        description: The release channel this build is published on, compiled in as HEX_BUILD_CHANNEL (src/updater.rs)
        type: string
        required: true
      environment:
        description: The GitHub environment holding the Apple secrets (release or release-dev)
        type: string
        required: true
      optional:
        description: Skip, rather than fail, when the environment lacks the Apple secrets
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    name: macOS arm64 (Developer ID)
    runs-on: macos-26
    environment: ${{ inputs.environment }}
    timeout-minutes: 120
    env:
      VOICE_CONTROL_TEAM_ID: 5NZ4Q7NXJ4
      HEX_VERSION: ${{ inputs.version }}
      HEX_BUILD_CHANNEL: ${{ inputs.channel }}
    steps:
      - name: Require the signing secrets
        id: secrets
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          OPTIONAL: ${{ inputs.optional }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_PATH: ${{ secrets.APPLE_API_KEY_PATH }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          missing=
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_API_KEY_PATH \
            APPLE_API_KEY APPLE_API_ISSUER; do
            eval "value=\${$name}"
            [ -n "$value" ] || missing="$missing $name"
          done
          if [ -z "$missing" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          elif [ "$OPTIONAL" = true ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::The $ENVIRONMENT environment lacks:$missing; skipping the macOS build."
            echo "No macOS build: the $ENVIRONMENT environment lacks$missing." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::error::The $ENVIRONMENT environment lacks:$missing. See docs/plans/macos-signing.md."
            exit 1
          fi
      - uses: actions/checkout@v7
        if: steps.secrets.outputs.available == 'true'
        with:
          ref: ${{ inputs.sha }}
          persist-credentials: false
      - name: Check the version
        if: steps.secrets.outputs.available == 'true'
        run: |
          actual=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "voice-control") | .version')
          # release-app.sh stamps a dev build's 0.0.0-dev-<run> or a beta in
          # (set-crate-version.sh).
          case "$HEX_VERSION" in
            "$actual" | "$actual"-beta.[0-9]* | 0.0.0-dev-[0-9]*) ;;
            *)
              echo "::error::$(git rev-parse --short HEAD) is version $actual, not $HEX_VERSION or a prerelease of it."
              exit 1
              ;;
          esac
      - uses: dtolnay/rust-toolchain@stable
        if: steps.secrets.outputs.available == 'true'
      - uses: Swatinem/rust-cache@v2
        if: steps.secrets.outputs.available == 'true'
        with:
          key: signed-build
          cache-on-failure: true
      - uses: astral-sh/setup-uv@v6
        if: steps.secrets.outputs.available == 'true'
      - uses: oven-sh/setup-bun@v2
        if: steps.secrets.outputs.available == 'true'
      - name: Install the Metal toolchain
        if: steps.secrets.outputs.available == 'true'
        run: xcrun --sdk macosx metal --version || xcodebuild -downloadComponent MetalToolchain
      - uses: apple-actions/import-codesign-certs@8f3fb608891dd2244cdab3d69cd68c0d37a7fe93 # v2.0.0
        if: steps.secrets.outputs.available == 'true'
        with:
          keychain: build
          p12-file-base64: ${{ secrets.APPLE_CERTIFICATE }}
          p12-password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      - name: Select the signing identity and notary key
        if: steps.secrets.outputs.available == 'true'
        env:
          APPLE_API_KEY_PATH: ${{ secrets.APPLE_API_KEY_PATH }}
        run: |
          identity=$(security find-identity -v -p codesigning build.keychain \
            | sed -n "s/.*\"\(Developer ID Application:.*($VOICE_CONTROL_TEAM_ID)\)\"/\1/p" | head -1)
          if [ -z "$identity" ]; then
            echo "::error::No Developer ID Application identity for team $VOICE_CONTROL_TEAM_ID in APPLE_CERTIFICATE."
            exit 1
          fi
          (umask 077; printf '%s\n' "$APPLE_API_KEY_PATH" > "$RUNNER_TEMP/notary-key.p8")
          {
            echo "VOICE_CONTROL_CODESIGN_IDENTITY=$identity"
            echo "HEX_NOTARY_KEY=$RUNNER_TEMP/notary-key.p8"
          } >> "$GITHUB_ENV"
      - name: Build, sign, and notarize
        if: steps.secrets.outputs.available == 'true'
        env:
          HEX_NOTARY_KEY_ID: ${{ secrets.APPLE_API_KEY }}
          HEX_NOTARY_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          scripts/setup.sh
          scripts/release-app.sh prepare
      - name: Remove the notary key
        if: always() && steps.secrets.outputs.available == 'true'
        run: rm -f "$RUNNER_TEMP/notary-key.p8"
      - name: Check the prepared release
        if: steps.secrets.outputs.available == 'true'
        run: |
          dmg="dist/Hex-$HEX_VERSION-macos-arm64.dmg"
          zip="dist/Hex-$HEX_VERSION-macos-arm64.zip"
          xcrun stapler validate "$dmg"
          spctl --assess --type open --context context:primary-signature --verbose=2 "$dmg"
          check=$(mktemp -d)
          hdiutil attach -quiet -nobrowse -readonly -mountpoint "$check/dmg" "$dmg"
          /usr/bin/ditto -x -k "$zip" "$check/update"
          build=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$check/dmg/Hex.app/Contents/Info.plist")
          scripts/validate-app.sh "$check/dmg/Hex.app" Hex.app "$HEX_VERSION" "$build"
          scripts/validate-app.sh "$check/update/Hex.app" Hex.app "$HEX_VERSION" "$build"
          xcrun stapler validate "$check/update/Hex.app"
          # What the in-app updater requires before it swaps the bundle in.
          codesign --verify --deep --strict -R="$(cat app/update-requirement.txt)" "$check/update/Hex.app"
          spctl --assess --type execute --verbose=2 "$check/dmg/Hex.app"
          diff -qr "$check/dmg/Hex.app" "$check/update/Hex.app"
          scripts/smoke-macos-app.sh "$check/dmg/Hex.app"
          hdiutil detach -quiet "$check/dmg"
          mkdir -p release
          cp "$dmg" "$zip" release/
          ls -l release >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: steps.secrets.outputs.available == 'true'
        with:
          name: hex-macos-arm64
          path: release/
          retention-days: 30
          if-no-files-found: error
